<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 680" width="520" height="680">
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&amp;display=swap');
    text { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
  </style>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0a0a0a"/>
    <stop offset="100%" stop-color="#111111"/>
  </linearGradient>
  <linearGradient id="og" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#FF6A00"/>
    <stop offset="100%" stop-color="#ff9a00"/>
  </linearGradient>
  <linearGradient id="og2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FF6A00"/>
    <stop offset="100%" stop-color="#c44e00"/>
  </linearGradient>
  <linearGradient id="blug" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1d4ed8"/>
    <stop offset="100%" stop-color="#2563eb"/>
  </linearGradient>
  <linearGradient id="grng" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#15803d"/>
    <stop offset="100%" stop-color="#16a34a"/>
  </linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FF6A00" stop-opacity="0.15"/>
    <stop offset="100%" stop-color="#FF6A00" stop-opacity="0"/>
  </linearGradient>
  <filter id="sh1">
    <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#FF6A00" flood-opacity="0.25"/>
  </filter>
  <filter id="sh2">
    <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
  </filter>
  <filter id="blur">
    <feGaussianBlur stdDeviation="40"/>
  </filter>
  <clipPath id="card-clip">
    <rect width="520" height="680" rx="24"/>
  </clipPath>
</defs>

<!-- ── Background ── -->
<rect width="520" height="680" rx="24" fill="url(#bg)"/>

<!-- Glow orbs -->
<circle cx="100" cy="120" r="180" fill="#FF6A00" opacity="0.05" filter="url(#blur)"/>
<circle cx="420" cy="500" r="160" fill="#1d4ed8" opacity="0.06" filter="url(#blur)"/>

<!-- Grid pattern -->
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
  <path d="M32 0L0 0 0 32" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.04"/>
</pattern>
<rect width="520" height="680" fill="url(#grid)" clip-path="url(#card-clip)"/>

<!-- ── Logo + Brand ── -->
<rect x="24" y="28" width="42" height="42" rx="11" fill="url(#og2)" filter="url(#sh1)"/>
