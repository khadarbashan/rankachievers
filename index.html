    <style>
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      body{
        font-family:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
        background:#060608;color:#fff;
        -webkit-font-smoothing:antialiased;
      }
      #root{min-height:100vh;}

      /* Splash */
      #ra-splash{
        position:fixed;inset:0;
        background:#060608;
        display:flex;flex-direction:column;
        align-items:center;justify-content:center;
        z-index:99999;
        transition:opacity .4s ease;
        gap:20px;
      }
      .ra-splash-logo{
        width:72px;height:72px;
        background:linear-gradient(135deg,#FF6A00,#ff9a00);
        border-radius:20px;
        display:flex;align-items:center;justify-content:center;
        font-weight:900;color:#fff;font-size:28px;
        box-shadow:0 8px 32px rgba(255,106,0,0.5);
        letter-spacing:-1px;
      }
      .ra-splash-name{font-weight:800;font-size:20px;color:#fff;text-align:center;}
      .ra-splash-sub{font-size:11px;color:#FF6A00;font-weight:700;letter-spacing:.18em;text-align:center;}
      .ra-splash-spinner{
        width:36px;height:36px;
        border:3px solid rgba(255,106,0,0.2);
        border-top:3px solid #FF6A00;
        border-radius:50%;
        animation:splashSpin .7s linear infinite;
      }
      .ra-splash-text{font-size:12px;color:rgba(255,255,255,0.3);}
      @keyframes splashSpin{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body>
    <!-- Skip to content -->
    <a href="#root" style="position:absolute;top:-40px;left:0;background:#FF6A00;color:#fff;padding:8px 16px;text-decoration:none;font-weight:700;border-radius:0 0 8px 0;z-index:9999" onfocus="this.style.top='0'" onblur="this.style.top='-40px'">Skip to main content</a>

    <!-- Splash screen -->
    <div id="ra-splash">
      <div class="ra-splash-logo">RA</div>
      <div>
        <div class="ra-splash-name">Rank Achievers</div>
        <div class="ra-splash-sub">ACADEMY · ANANTAPUR</div>
      </div>
      <div class="ra-splash-spinner"></div>
      <div class="ra-splash-text">Loading your practice platform...</div>
    </div>

    <!-- App root -->
    <div id="root"></div>

    <script>
      // Remove splash after React mounts
      window.__removeSplash = function(){
        var s = document.getElementById("ra-splash");
        if(s){ s.style.opacity="0"; setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); },450); }
      };
      // Fallback: force remove after 4 seconds no matter what
      setTimeout(function(){ window.__removeSplash && window.__removeSplash(); }, 4000);
      // Service Worker
      if("serviceWorker" in navigator){
        window.addEventListener("load",function(){
          navigator.serviceWorker.register("/sw.js").catch(function(){});
        });
      }
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
